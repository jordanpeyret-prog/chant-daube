function buildWeek(e) {
  return [
    { e: "🎵", t: "Le chant", d: e.song + " Mémo : " + e.mnemonic },
    { e: "👁️", t: "Le plumage", d: e.idc[0] + " " + e.idc[1] },
    { e: "🔬", t: "Affiner", d: e.idc[2] },
    { e: "🌿", t: "Écologie", d: e.eco[0] },
    { e: "✨", t: "L’anecdote", d: e.fact },
    { e: "📸", t: "Photo du jour", d: e.idc[3] + " Vérifie sur la vraie photo en tête de fiche !" },
    { e: "🏆", t: "Défi du jour", d: e.defi },
  ];
}

function expandSpecies(e) {
  return {
    ...e,
    eco: { habitat: e.eco[0], regime: e.eco[1], repro: e.eco[2], pheno: e.eco[3], statut: e.eco[4] },
    week: buildWeek(e),
  };
}

function catOf(s) {
  const g = s.group ?? "";
  if (g.indexOf("Strigiformes") >= 0) return "Rapaces nocturnes";
  if (g.indexOf("Piciformes") >= 0) return "Pics & apparentés";
  if (g.indexOf("Accipitriformes") >= 0 || g.indexOf("Falconiformes") >= 0) return "Rapaces diurnes";
  if (g.indexOf("Passériformes") >= 0) return "Passereaux";
  if (
    g.indexOf("Anseriformes") >= 0 || g.indexOf("Podicipédiformes") >= 0 || g.indexOf("Pélécaniformes") >= 0 ||
    g.indexOf("Charadriiformes") >= 0 || g.indexOf("Gruiformes") >= 0 || g.indexOf("Suliformes") >= 0
  ) return "Oiseaux d’eau";
  return "Autres";
}

const SPECIES = BASE.concat(EXTRA.map(expandSpecies));

/* ================= AUDIO : xeno-canto + repli Web Audio ================= */

let AC = null;
const XC_API = "https://xeno-canto.org/api/2/recordings";
const XC_CACHE = new Map();

function audioCtx() {
  if (typeof window === "undefined") return null;
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    AC = new Ctor();
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}

async function xenoCantoRecording(s) {
  const key = s.latin;
  if (XC_CACHE.has(key)) return XC_CACHE.get(key);

  const promise = (async () => {
    try {
      const url = `${XC_API}?query=${encodeURIComponent(s.latin)}`;
      const res = await fetch(url, { headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error(`xeno-canto HTTP ${res.status}`);
      const data = await res.json();
      const recordings = Array.isArray(data.recordings) ? data.recordings : [];

      // On ne garde que les fichiers réellement diffusables et sous Creative Commons.
      const cc = recordings.filter((r) =>
        r?.file && /^https?:/i.test(r.file) && /creativecommons\.org/i.test(r.lic || "")
      );
      if (!cc.length) return null;

      const rank = (r) => {
        const q = ({ A: 40, B: 30, C: 18, D: 8, E: 0 })[r.q] ?? 0;
        const type = String(r.type || "").toLowerCase();
        const song = type.includes("song") ? 35 : 0;
        const france = String(r.cnt || "").toLowerCase() === "france" ? 10 : 0;
        const clean = /-nd\//i.test(r.lic || "") ? -25 : 0;
        return q + song + france + clean;
      };

      cc.sort((a, b) => rank(b) - rank(a));
      const r = cc[0];
      return {
        id: r.id,
        url: r.file,
        page: r.url ? (r.url.startsWith("http") ? r.url : `https://xeno-canto.org${r.url}`) : `https://xeno-canto.org/${r.id}`,
        recordist: r.rec || "Enregistreur inconnu",
        country: r.cnt || "",
        location: r.loc || "",
        type: r.type || "",
        quality: r.q || "",
        license: r.lic || "",
      };
    } catch (err) {
      console.warn("xeno-canto indisponible, repli sur le son synthétique", err);
      return null;
    }
  })();

  XC_CACHE.set(key, promise);
  return promise;
}

function playSyntheticSong(s, volume, loop) {
  const vol = volume == null ? 0.6 : volume;
  let stopped = false;
  let timer = null;
  const run = () => {
    if (stopped) return;
    const c = audioCtx();
    if (!c) return;
    const master = c.createGain();
    master.gain.value = vol * 0.5;
    master.connect(c.destination);
    let t = c.currentTime + 0.05;
    for (const n of s.notes) {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = n.v ?? "sine";
      o.frequency.setValueAtTime(n.f1, t);
      if (n.f2 && Math.abs(n.f2 - n.f1) > 1) o.frequency.exponentialRampToValueAtTime(n.f2, t + n.d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(1, t + 0.012);
      g.gain.setValueAtTime(1, t + Math.max(0.012, n.d * 0.6));
      g.gain.exponentialRampToValueAtTime(0.0001, t + n.d + 0.04);
      o.connect(g);
      g.connect(master);
      o.start(t);
      o.stop(t + n.d + 0.06);
      t += n.d + (n.g ?? 0.09);
    }
    const total = (t - c.currentTime) * 1000;
    if (loop) timer = setTimeout(run, Math.max(300, total));
  };
  run();
  return () => {
    stopped = true;
    if (timer) clearTimeout(timer);
  };
}

function playSong(s, volume, loop) {
  const vol = volume == null ? 0.6 : volume;
  let stopped = false;
  let audio = null;
  let fallbackStop = null;

  // Retourne immédiatement un stop function : le fetch xeno-canto se fait en parallèle.
  xenoCantoRecording(s).then((recording) => {
    if (stopped) return;
    if (!recording) {
      fallbackStop = playSyntheticSong(s, vol, loop);
      return;
    }

    audio = new Audio(recording.url);
    audio.volume = Math.max(0, Math.min(1, vol));
    audio.loop = Boolean(loop);
    audio.preload = "auto";
    audio.play().catch(() => {
      if (!stopped) fallbackStop = playSyntheticSong(s, vol, loop);
    });
  });

  return () => {
    stopped = true;
    if (fallbackStop) fallbackStop();
    if (audio) {
      audio.pause();
      audio.currentTime = 0;
      audio.src = "";
      audio = null;
    }
  };
}

/* ================= UTILS ================= */

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pad(n) { return String(n).padStart(2, "0"); }
function fmtHM(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return { ...fallback, ...parsed };
  } catch { return fallback; }
}
function save(key, v) {
  try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
}
function flagOf(code) { return COUNTRIES.find((c) => c.code === code)?.flag ?? code; }

function BirdArt({ s, className = "" }) {
  const ph = photoOf(s);
  const [photoErr, setPhotoErr] = useState(false);
  if (ph && !photoErr) {
    return (
      <div className={"relative overflow-hidden " + className}>
        <img
          src={ph.u}
          alt={s.fr}
          onError={() => setPhotoErr(true)}
          className="absolute inset-0 w-full h-full object-cover"
        />
        <div className="absolute inset-0 bg-gradient-to-t from-black/45 via-transparent to-black/10 pointer-events-none" />
      </div>
    );
  }
  const a = s.art;
  const plan = a.plan ?? "perch";
  const sc = a.size ?? 1;
  const gid = "sky-" + s.id;
  return (
    <svg viewBox="0 0 120 100" className={className} preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={s.sky[0]} />
          <stop offset="1" stopColor={s.sky[1]} />
        </linearGradient>
      </defs>
      <rect width="120" height="100" fill={"url(#" + gid + ")"} />
      <circle cx="102" cy="16" r="8" fill="#ffffff" opacity="0.12" />
      <g transform={"translate(" + 60 * (1 - sc) + " " + 88 * (1 - sc) + ") scale(" + sc + ")"}>

      </g>

  );
}

function QuizScreen({ pool, settings, record, onOpenDetail }) {
  const [session, setSession] = useState(null);
  const [replaying, setReplaying] = useState(false);
  const stopRef = useRef(null);
  const stopAudio = () => { if (stopRef.current) { stopRef.current(); stopRef.current = null; } setReplaying(false); };

  useEffect(() => stopAudio, []);

  const start = (mode) => {
    stopAudio();
    const targets = shuffle(pool).slice(0, 5);
    const qs = targets.map((t) => ({
      kind: mode === "mix" ? (Math.random() < 0.5 ? "audio" : "photo") : mode,
      target: t,
      options: shuffle([t, ...shuffle(pool.filter((x) => x.id !== t.id)).slice(0, settings.choices - 1)]),
    }));
    setSession({ qs, i: 0, picks: [] });
  };

  const q = session ? session.qs[session.i] : null;

  useEffect(() => {
    stopAudio();
    if (q && q.kind === "audio") {
      stopRef.current = playSong(q.target, settings.volume);
      setReplaying(true);
      const dur = (q.target.notes.reduce((acc, n) => acc + n.d + (n.g ?? 0.09), 0) + 0.3) * 1000;
      const t = setTimeout(() => setReplaying(false), dur);
      return () => { clearTimeout(t); };
    }
  }, [session ? session.i : null, session ? session.qs : null]);

  if (!session || !q) {
    return (
      <div className="px-5 pt-4 pb-6 space-y-4">
        <h2 className="text-2xl font-bold text-white">Entraînement 🎓</h2>
        <p className="text-white/50 text-sm leading-relaxed">5 questions, tirées de votre liste régionale. Identifiez, apprenez, recommencez.</p>
        {[
          { mode: "audio", emoji: "🎧", t: "À l’oreille", d: "Écoutez le chant → devinez l’espèce" },
          { mode: "photo", emoji: "👁️", t: "À l’œil", d: "Observez le plumage → devinez l’espèce" },
          { mode: "mix", emoji: "⭐", t: "Mixte", d: "Chants et silhouettes, au hasard" },
        ].map((m) => (
          <button key={m.mode} onClick={() => start(m.mode)} className="w-full text-left bg-white/5 border border-white/10 rounded-3xl p-5 flex items-center gap-4 active:scale-[0.98] transition-transform hover:border-orange-400/40">
            <div className="text-3xl w-12 h-12 rounded-2xl bg-white/8 flex items-center justify-center">{m.emoji}</div>
            <div className="flex-1">
              <div className="text-white font-semibold">{m.t}</div>
              <div className="text-white/45 text-xs mt-0.5">{m.d}</div>
            </div>
            <div className="text-white/30">›</div>
          </button>
        ))}
        <div className="text-center text-[10px] text-white/30 leading-relaxed px-4">
          Les chants sont chargés depuis xeno-canto (Creative Commons) quand un enregistrement est disponible ; le son synthétique sert de repli hors ligne.
        </div>
      </div>
    );
  }

  const picked = session.picks[session.i] ?? null;
  const answered = picked !== null;
  const ok = picked === q.target.id;
  const isLast = session.i === session.qs.length - 1;

  const answer = (id) => {
    if (answered) return;
    const picks = { ...session.picks };
    picks[session.i] = id;
    setSession({ ...session, picks });
    record(q.target, id === q.target.id);
  };

  const results = isLast && answered;

  return (
    <div className="px-5 pt-4 pb-6 space-y-4">
      <div className="flex items-center gap-1.5">
        {session.qs.map((_, i) => (
          <div key={i} className={"h-1.5 flex-1 rounded-full " + (i < session.i ? "bg-orange-400" : i === session.i ? "bg-orange-300/50" : "bg-white/10")} />
        ))}
      </div>

      {results ? (
        <div className="space-y-4">
          <div className="text-center pt-4">
            <div className="text-5xl">{session.qs.filter((x, i) => session.picks[i] === x.target.id).length >= 4 ? "🏆" : "🌱"}</div>
            <div className="text-3xl font-extrabold text-white mt-2">
              {session.qs.filter((x, i) => session.picks[i] === x.target.id).length}/{session.qs.length}
            </div>
            <div className="text-white/50 text-sm">Révisions à prévoir :</div>
          </div>
          {session.qs.map((x, i) => {
            const good = session.picks[i] === x.target.id;
            return (
              <button key={x.target.id} onClick={() => onOpenDetail(x.target)} className="w-full flex items-center gap-3 bg-white/5 border border-white/10 rounded-2xl p-3 text-left active:scale-[0.98] transition-transform">
                <div className="w-14 h-12 rounded-xl overflow-hidden shrink-0"><BirdArt s={x.target} className="w-full h-full" /></div>
                <div className="flex-1 min-w-0">
                  <div className="text-white text-sm font-medium truncate">{x.target.fr}</div>

function SpeciesScreen({ pool, settings, onOpenDetail, onRegion, pinned, onPin }) {

  useEffect(() => () => { if (stopRef.current) stopRef.current(); }, []);

  const cats = ["Tous"].concat(Array.from(new Set(pool.map(catOf))));

    (cat === "Tous" || catOf(s) === cat) &&
    (!ql || (s.fr + " " + s.latin).toLowerCase().indexOf(ql) >= 0)
  );

  const play = (s) => {
    if (stopRef.current) stopRef.current();
    if (playingId === s.id) { setPlayingId(null); return; }
    stopRef.current = playSong(s, settings.volume);
    setPlayingId(s.id);
    const dur = (s.notes.reduce((acc, n) => acc + n.d + (n.g ?? 0.09), 0) + 0.4) * 1000;

  return (

      <div className="-mx-1 flex gap-2 overflow-x-auto px-1 pb-1">
        <Chip active={settings.region === "ALL"} onClick={() => onRegion("ALL")}>🌍 Toute l’Europe</Chip>

          <Chip key={c.code} active={settings.region === c.code} onClick={() => onRegion(c.code)}>{c.flag} {c.name}</Chip>

      <div className="-mx-1 flex gap-2 overflow-x-auto px-1 pb-1">
        {cats.map((c) => (
          <Chip key={c} active={cat === c} onClick={() => setCat(c)}>{(c === "Tous" ? "🐦 " : (CAT_EMOJI[c] ?? "🐦 ") + " ") + c}</Chip>
        ))}
      </div>
      <div className="text-white/40 text-[11px] -mt-1">

      </div>
      <div className="text-white/30 text-[10px] leading-relaxed">📌 = programmée comme espèce de la semaine · sans épingle, une nouvelle espèce arrive chaque semaine</div>

            <button onClick={() => onOpenDetail(s)} className="w-16 h-14 rounded-xl overflow-hidden shrink-0 active:scale-95 transition-transform">
              <BirdArt s={s} className="w-full h-full" />
            </button>
            <button onClick={() => onOpenDetail(s)} className="flex-1 min-w-0 text-left">

/* ================= QUIZ DE LA SEMAINE (JOUR 7) ================= */

function buildRecap(s, pool) {
  const others = shuffle(pool.filter((x) => x.id !== s.id));
  const mk = (k, q, a, alts) => ({
    k, q, a,
    opts: shuffle([a, ...alts.filter((x) => x && x !== a).slice(0, 3)]),
  });
  return [
    mk("🎧", "Comment décrit-on son chant ?", s.song, others.map((o) => o.song)),
    mk("💡", "Quel moyen mnémotechnique correspond à son chant ?", s.mnemonic, others.map((o) => o.mnemonic)),
    mk("🔎", "Quel critère d’identification lui correspond ?", s.idc[0], others.map((o) => o.idc[0])),
    mk("✨", "Laquelle de ces anecdotes le concerne ?", s.fact, others.map((o) => o.fact)),
    mk("🏆", "Quel défi du jour 7 a été proposé pour cette espèce ?", s.week[6].d, others.map((o) => o.week[6].d)),
  ];
}

function WeekRecap({ bird, pool, record, onClose, onOpenDetail }) {
  const [qs] = useState(() => buildRecap(bird, pool));
  const [i, setI] = useState(0);
  const [picks, setPicks] = useState({});
  const picked = picks[i] ?? null;
  const answered = picked !== null;
  const score = Object.keys(picks).filter((k) => picks[k] === qs[k].a).length;
  const finished = i === qs.length - 1 && answered;

  const answer = (opt) => {
    if (answered) return;
    setPicks({ ...picks, [i]: opt });
    record(bird, opt === qs[i].a);
  };

  return (
    <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="absolute inset-0 z-50 bg-gradient-to-b from-[#1b1038] via-[#241540] to-[#0f0a1e] flex flex-col overflow-y-auto">
      <div className="px-5 pt-6 pb-8">
        <div className="flex items-center justify-between">
          <div>
            <div className="text-[11px] uppercase tracking-[0.25em] text-orange-300/80 font-semibold">Jour 7</div>
            <h2 className="text-xl font-bold text-white">Quiz de la semaine 🏆</h2>
          </div>
          <button onClick={onClose} className="text-white/40 text-xs underline">Quitter</button>
        </div>
        <div className="text-white/45 text-[11px] mt-1">{bird.fr} · {bird.latin}</div>

        <div className="flex items-center gap-1.5 mt-4">
          {qs.map((_, idx) => (
            <div key={idx} className={"h-1.5 flex-1 rounded-full " + (idx < i ? "bg-orange-400" : idx === i ? "bg-orange-300/50" : "bg-white/10")} />
          ))}
        </div>

        {finished ? (
          <div className="mt-6 space-y-4">
            <div className="text-center">
              <div className="text-5xl">{score >= 4 ? "🏅" : "🌱"}</div>
              <div className="text-3xl font-extrabold text-white mt-2">{score}/{qs.length}</div>
              <div className="text-white/60 text-sm mt-1">
                {score >= 4 ? "Semaine validée — vous maîtrisez le " + bird.fr + " !" : "Presque — revoyez la fiche, un nouvel oiseau arrive la semaine prochaine !"}
              </div>
            </div>
            <div className="flex gap-3">
              <button onClick={() => onOpenDetail(bird)} className="flex-1 py-3.5 rounded-2xl bg-white/10 border border-white/15 text-white font-medium active:scale-95 transition-transform">Revoir la fiche</button>
              <button onClick={onClose} className="flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-400 text-white font-bold active:scale-95 transition-transform">Terminer</button>
            </div>
          </div>
        ) : (
          <div className="mt-6 space-y-4">
            <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
              <div className="text-2xl">{qs[i].k}</div>
              <div className="text-white font-semibold text-sm mt-2">{qs[i].q}</div>
            </div>
            <div className="space-y-2.5">
              {qs[i].opts.map((opt) => {
                const isPick = picked === opt;
                const isRight = answered && opt === qs[i].a;
                return (
                  <button
                    key={opt}
                    onClick={() => answer(opt)}
                    disabled={answered}
                    className={
                      "w-full text-left px-4 py-3 rounded-2xl text-xs leading-relaxed border transition-colors " +
                      (isRight
                        ? "bg-green-500/20 border-green-400/50 text-green-200"
                        : isPick
                          ? "bg-red-500/15 border-red-400/40 text-red-200"
                          : "bg-white/8 border-white/15 text-white disabled:opacity-60")
                    }
                  >
                    {opt}
                  </button>
                );
              })}
            </div>
            {answered && (
              <button
                onClick={() => setI(i + 1)}
                className="w-full py-3.5 rounded-2xl bg-orange-500 text-white font-bold text-sm active:scale-95 transition-transform"
              >
                Question suivante
              </button>
            )}
          </div>
        )}
      </div>
    </motion.div>
  );
}

            <span className="text-white/60 text-xs">Volume des chants</span>
            <span className="text-white/40 text-[11px] tabular-nums">{Math.round(settings.volume * 100)}%</span>
          </div>
          <input
            type="range" min={0} max={1} step={0.05}
            value={settings.volume}
            onChange={(e) => setSettings({ ...settings, volume: Number(e.target.value) })}
            className="w-full accent-orange-400"
          />
        </div>
        <div className="flex items-center justify-between">
          <div>
            <div className="text-white/60 text-xs">Fondu progressif du réveil</div>
            <div className="text-white/30 text-[10px]">Le chant démarre doucement</div>
          </div>
          <Switch on={settings.fade} onChange={(v) => setSettings({ ...settings, fade: v })} />
        </div>
      </div>

      <div className="bg-white/5 border border-white/10 rounded-3xl p-5 space-y-2">
        <div className="text-white font-semibold text-sm">📊 Sources de données</div>
        <div className="text-white/60 text-xs leading-relaxed">
          Listes régionales d’espèces : eBird (Cornell Lab). Photos : Wikimedia Commons (licences Creative Commons — crédit affiché dans chaque fiche). Chants : enregistrements xeno-canto sous licences Creative Commons quand disponibles, avec son synthétique de secours.
        </div>
      </div>

      <div className="bg-white/5 border border-white/10 rounded-3xl p-5 space-y-2">
        <div className="text-white font-semibold text-sm">🚀 Vers la version installable</div>
        <ul className="text-white/60 text-xs leading-relaxed space-y-1.5">
          <li>• Étape 1 — valider le concept avec ce prototype</li>
          <li>• Étape 2 — PWA installable depuis Safari (ajout à l’écran d’accueil)</li>
          <li>• Étape 3 — app native SwiftUI : sonnerie en fond sonore, notifications, GPS pour la région automatique, puis TestFlight/App Store</li>
        </ul>
      </div>
    </div>
  );
}

/* ================= APP ================= */

function App() {
  const [tab, setTab] = useState("reveil");
  const [now, setNow] = useState(new Date());
  const [settings, setSettings] = useState(() => load("ca-settings", { region: "ALL", choices: 4, volume: 0.6, fade: true, pinned: null }));
  const [stats, setStats] = useState(() => load("ca-stats", { streak: 0, best: 0, correct: 0, answered: 0, perSpecies: {} }));
  const [alarm, setAlarm] = useState({ on: true, h: 7, m: 0 });
  const [ringing, setRinging] = useState(null);
  const [detail, setDetail] = useState(null);
  const [recap, setRecap] = useState(false);

  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  useEffect(() => { save("ca-settings", settings); }, [settings]);
  useEffect(() => { save("ca-stats", stats); }, [stats]);

  const pool = useMemo(
    () => SPECIES.filter((s) => settings.region === "ALL" || s.countries.includes(settings.region)),
    [settings.region]
  );

  const dayIdx = Math.floor((now.getTime() - new Date(now.getFullYear(), 0, 0).getTime()) / 86400000);
  const weekNumber = Math.floor(dayIdx / 7);
  const pinnedSp = settings.pinned ? (SPECIES.find((s) => s.id === settings.pinned) ?? null) : null;
  const speciesOfWeek = pinnedSp || (pool.length ? pool[weekNumber % pool.length] : null);
  const dayOfWeek = (dayIdx % 7) + 1;

  const record = (s, ok) =>
    setStats((st) => {
      const ps = { ...st.perSpecies };
      const e = ps[s.id] ?? { correct: 0, seen: 0 };
      ps[s.id] = { correct: e.correct + (ok ? 1 : 0), seen: e.seen + 1 };
      const streak = ok ? st.streak + 1 : 0;
      return { streak, best: Math.max(st.best, streak), correct: st.correct + (ok ? 1 : 0), answered: st.answered + 1, perSpecies: ps };
    });

  const startRinging = () => {
    if (!speciesOfWeek || !pool.length) return;
    setRinging(speciesOfWeek);
  };

  const ringingOptions = useMemo(() => {
    if (!ringing) return [];
    return shuffle([ringing, ...shuffle(pool.filter((s) => s.id !== ringing.id)).slice(0, settings.choices - 1)]);
  }, [ringing]);

  const screens = {
    reveil: (
      <ReveilScreen
        now={now}
        alarm={alarm}
        setAlarm={setAlarm}
        speciesOfWeek={speciesOfWeek}
        dayOfWeek={dayOfWeek}
        settings={settings}
        stats={stats}
        onTest={startRinging}
        onRecap={() => setRecap(true)}
      />
    ),
    quiz: <QuizScreen pool={pool} settings={settings} record={record} onOpenDetail={(s) => setDetail(s)} />,
    especes: <SpeciesScreen pool={pool} settings={settings} onOpenDetail={(s) => setDetail(s)} onRegion={(r) => setSettings({ ...settings, region: r })} pinned={settings.pinned} onPin={(id) => setSettings({ ...settings, pinned: id })} />,
    reglages: <SettingsScreen settings={settings} setSettings={setSettings} speciesOfWeek={speciesOfWeek} pool={pool} />,
  };

  return (
    <div
      className="min-h-screen w-full flex items-center justify-center p-4"
      style={{ background: "radial-gradient(1200px 600px at 20% 0%, #2b1b50 0%, #12091f 55%, #0a0614 100%)" }}
    >
      <div className="relative w-[375px] h-[800px] max-h-[96vh] rounded-[46px] bg-[#0d0a1a] border-[10px] border-[#1c1830] shadow-2xl overflow-hidden flex flex-col">
        <div className="absolute top-2 left-1/2 -translate-x-1/2 w-24 h-6 rounded-full bg-black z-50" />
        <div className="flex justify-between items-center px-7 pt-3 pb-1 text-[12px] font-semibold text-white/90 z-10">
          <span className="tabular-nums">{fmtHM(now)}</span>
          <span className="flex gap-1.5 items-center text-[10px]">
            <span className="text-white/40">PROTO</span>
            <span>📶</span>
            <span>🔋</span>
          </span>
        </div>

        <div className="flex-1 overflow-y-auto">{screens[tab]}</div>

        <div className="border-t border-white/10 bg-[#0d0a1a]/95 px-2 pt-2 pb-1 flex">
          {[
            { t: "reveil", e: "⏰", l: "Réveil" },
            { t: "quiz", e: "🎓", l: "Entraîner" },
            { t: "especes", e: "🐦", l: "Espèces" },
            { t: "reglages", e: "⚙️", l: "Réglages" },
          ].map((x) => (
            <button
              key={x.t}
              onClick={() => setTab(x.t)}
              className={"flex-1 flex flex-col items-center gap-0.5 py-1 rounded-xl " + (tab === x.t ? "text-orange-300" : "text-white/40")}
            >
              <span className="text-lg leading-none">{x.e}</span>
              <span className="text-[9px] font-medium">{x.l}</span>
            </button>
          ))}
        </div>
        <div className="flex justify-center pb-2 pt-1">
          <div className="w-32 h-1 rounded-full bg-white/30" />
        </div>

        <AnimatePresence>
          {ringing && (
            <Ringing
              bird={ringing}
              options={ringingOptions}
              settings={settings}
              dayOfWeek={dayOfWeek}
              onSnooze={() => setRinging(null)}
              onWin={() => record(ringing, true)}
              onOpenDetail={(s) => { setRinging(null); setDetail(s); }}
            />
          )}
        </AnimatePresence>

        <AnimatePresence>
          {detail && (
            <SpeciesSheet s={detail} settings={settings} dayOfWeek={dayOfWeek} pinned={settings.pinned} onPin={(id) => setSettings({ ...settings, pinned: id })} onClose={() => setDetail(null)} />
          )}
        </AnimatePresence>

        {recap && speciesOfWeek && (
          <WeekRecap bird={speciesOfWeek} pool={pool} record={record} onClose={() => setRecap(false)} onOpenDetail={(s) => { setRecap(false); setDetail(s); }} />
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.warn));</script></body></html>
